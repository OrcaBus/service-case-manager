version: 2

updates:
  # npm (pnpm) - CDK infrastructure
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 3
    open-pull-requests-limit: 3
    groups:
      npm-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
